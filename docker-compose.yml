services:
  postgres:
    image: postgres:16-alpine
    container_name: atesteme-taskmanager-db
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: atesteme-taskmanager-api
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/taskmanager
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: change-me-to-a-long-secret-with-at-least-32-bytes
      JWT_EXPIRATION: 900000
      JWT_REFRESH_EXPIRATION: 604800000
      APP_BRAND_NAME: "${APP_BRAND_NAME:-Task Manager}"
      APP_BRAND_LIGHT_PRIMARY: "${APP_BRAND_LIGHT_PRIMARY:-#01B636}"
      APP_BRAND_LIGHT_SECONDARY: "${APP_BRAND_LIGHT_SECONDARY:-#3BD16F}"
      APP_BRAND_LIGHT_ACCENT: "${APP_BRAND_LIGHT_ACCENT:-#74E39A}"
      APP_BRAND_LIGHT_BACKGROUND: "${APP_BRAND_LIGHT_BACKGROUND:-#F7FBF8}"
      APP_BRAND_LIGHT_SURFACE: "${APP_BRAND_LIGHT_SURFACE:-#FFFFFF}"
      APP_BRAND_LIGHT_SURFACE_SOFT: "${APP_BRAND_LIGHT_SURFACE_SOFT:-#F4FFF6}"
      APP_BRAND_LIGHT_BORDER: "${APP_BRAND_LIGHT_BORDER:-#E3E3E3}"
      APP_BRAND_LIGHT_MUTED: "${APP_BRAND_LIGHT_MUTED:-#989898}"
      APP_BRAND_LIGHT_TEXT: "${APP_BRAND_LIGHT_TEXT:-#17211F}"
      APP_BRAND_DARK_PRIMARY: "${APP_BRAND_DARK_PRIMARY:-#003297}"
      APP_BRAND_DARK_SECONDARY: "${APP_BRAND_DARK_SECONDARY:-#00157F}"
      APP_BRAND_DARK_ACCENT: "${APP_BRAND_DARK_ACCENT:-#00094B}"
      APP_BRAND_DARK_BACKGROUND: "${APP_BRAND_DARK_BACKGROUND:-#0C0C0C}"
      APP_BRAND_DARK_SURFACE: "${APP_BRAND_DARK_SURFACE:-#1D1D1D}"
      APP_BRAND_DARK_SURFACE_SOFT: "${APP_BRAND_DARK_SURFACE_SOFT:-#242424}"
      APP_BRAND_DARK_BORDER: "${APP_BRAND_DARK_BORDER:-#003297}"
      APP_BRAND_DARK_MUTED: "${APP_BRAND_DARK_MUTED:-#989898}"
      APP_BRAND_DARK_TEXT: "${APP_BRAND_DARK_TEXT:-#E3E3E3}"
      APP_BRAND_FALLBACK_PRIMARY: "${APP_BRAND_FALLBACK_PRIMARY:-#DFCCB4}"
      APP_BRAND_FALLBACK_SECONDARY: "${APP_BRAND_FALLBACK_SECONDARY:-#ECDAC3}"
      APP_BRAND_FALLBACK_ACCENT: "${APP_BRAND_FALLBACK_ACCENT:-#FEDEB8}"
      APP_BRAND_FALLBACK_BACKGROUND: "${APP_BRAND_FALLBACK_BACKGROUND:-#FEF5E2}"
      APP_BRAND_FALLBACK_SURFACE: "${APP_BRAND_FALLBACK_SURFACE:-#F6E8D5}"
      APP_BRAND_FALLBACK_SURFACE_SOFT: "${APP_BRAND_FALLBACK_SURFACE_SOFT:-#FEDEB8}"
      APP_BRAND_FALLBACK_BORDER: "${APP_BRAND_FALLBACK_BORDER:-#ECDAC3}"
      APP_BRAND_FALLBACK_MUTED: "${APP_BRAND_FALLBACK_MUTED:-#8F7E69}"
      APP_BRAND_FALLBACK_TEXT: "${APP_BRAND_FALLBACK_TEXT:-#3A3026}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: atesteme-taskmanager-web
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
