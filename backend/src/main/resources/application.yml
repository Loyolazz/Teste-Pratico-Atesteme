server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: atesteme-taskmanager
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:taskmanager;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

security:
  jwt:
    secret: ${JWT_SECRET:atesteme-task-manager-secret-key-with-at-least-thirty-two-bytes}
    expiration-ms: ${JWT_EXPIRATION:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  branding:
    app-name: "${APP_BRAND_NAME:Task Manager}"
    light:
      primary: "${APP_BRAND_LIGHT_PRIMARY:#01B636}"
      secondary: "${APP_BRAND_LIGHT_SECONDARY:#3BD16F}"
      accent: "${APP_BRAND_LIGHT_ACCENT:#74E39A}"
      background: "${APP_BRAND_LIGHT_BACKGROUND:#F7FBF8}"
      surface: "${APP_BRAND_LIGHT_SURFACE:#FFFFFF}"
      surface-soft: "${APP_BRAND_LIGHT_SURFACE_SOFT:#F4FFF6}"
      border: "${APP_BRAND_LIGHT_BORDER:#E3E3E3}"
      muted: "${APP_BRAND_LIGHT_MUTED:#989898}"
      text: "${APP_BRAND_LIGHT_TEXT:#17211F}"
    dark:
      primary: "${APP_BRAND_DARK_PRIMARY:#003297}"
      secondary: "${APP_BRAND_DARK_SECONDARY:#00157F}"
      accent: "${APP_BRAND_DARK_ACCENT:#00094B}"
      background: "${APP_BRAND_DARK_BACKGROUND:#0C0C0C}"
      surface: "${APP_BRAND_DARK_SURFACE:#1D1D1D}"
      surface-soft: "${APP_BRAND_DARK_SURFACE_SOFT:#242424}"
      border: "${APP_BRAND_DARK_BORDER:#003297}"
      muted: "${APP_BRAND_DARK_MUTED:#989898}"
      text: "${APP_BRAND_DARK_TEXT:#E3E3E3}"
    fallback:
      primary: "${APP_BRAND_FALLBACK_PRIMARY:#DFCCB4}"
      secondary: "${APP_BRAND_FALLBACK_SECONDARY:#ECDAC3}"
      accent: "${APP_BRAND_FALLBACK_ACCENT:#FEDEB8}"
      background: "${APP_BRAND_FALLBACK_BACKGROUND:#FEF5E2}"
      surface: "${APP_BRAND_FALLBACK_SURFACE:#F6E8D5}"
      surface-soft: "${APP_BRAND_FALLBACK_SURFACE_SOFT:#FEDEB8}"
      border: "${APP_BRAND_FALLBACK_BORDER:#ECDAC3}"
      muted: "${APP_BRAND_FALLBACK_MUTED:#8F7E69}"
      text: "${APP_BRAND_FALLBACK_TEXT:#3A3026}"
