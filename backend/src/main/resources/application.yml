server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: atesteme-taskmanager
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:taskmanager;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

security:
  jwt:
    secret: ${JWT_SECRET:atesteme-task-manager-secret-key-with-at-least-thirty-two-bytes}
    expiration-ms: ${JWT_EXPIRATION:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  branding:
    app-name: "${APP_BRAND_NAME:Task Manager}"
    super-green: "${APP_BRAND_SUPER_GREEN:#01B636}"
    emerald: "${APP_BRAND_EMERALD:#3BD16F}"
    harmony-green: "${APP_BRAND_HARMONY_GREEN:#74E39A}"
    silvery-white: "${APP_BRAND_SILVERY_WHITE:#E3E3E3}"
    lena: "${APP_BRAND_LENA:#989898}"
    background: "${APP_BRAND_BACKGROUND:#F7FBF8}"
    surface: "${APP_BRAND_SURFACE:#FFFFFF}"
    surface-soft: "${APP_BRAND_SURFACE_SOFT:#F4FFF6}"
    text: "${APP_BRAND_TEXT:#17211F}"
